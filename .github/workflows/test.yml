name: test

on:
  push:
    branches:
      - main
      - 'copilot/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Terraform format check
  # ---------------------------------------------------------------------------
  fmt:
    name: Terraform Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9 # v3.5.3

      - uses: hashicorp/setup-terraform@651471c36a6092792c552e8b1bef71e592b462d8 # v3.1.1
        with:
          terraform_version: "~1.9"

      - name: Check Terraform formatting
        run: terraform fmt -recursive -check .

  # ---------------------------------------------------------------------------
  # Terraform validate
  # ---------------------------------------------------------------------------
  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9 # v3.5.3

      - uses: hashicorp/setup-terraform@651471c36a6092792c552e8b1bef71e592b462d8 # v3.1.1
        with:
          terraform_version: "~1.9"

      - name: terraform init (no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

  # ---------------------------------------------------------------------------
  # Native terraform test (unit / plan-level, no AWS credentials required)
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests (terraform test)
    runs-on: ubuntu-latest
    needs: [fmt, validate]
    steps:
      - uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9 # v3.5.3

      - uses: hashicorp/setup-terraform@651471c36a6092792c552e8b1bef71e592b462d8 # v3.1.1
        with:
          terraform_version: "~1.9"

      - name: terraform init
        run: terraform init -backend=false

      - name: terraform test
        run: terraform test

  # ---------------------------------------------------------------------------
  # Go build check for Terratest integration tests
  # ---------------------------------------------------------------------------
  integration-build:
    name: Integration Test Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9 # v3.5.3

      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: test/go.mod
          cache: true
          cache-dependency-path: test/go.sum

      - name: Build and vet integration tests
        working-directory: test
        run: |
          go mod download
          go build ./...
          go vet ./...
